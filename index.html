<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dossiê</title>
  <meta name="description" content="Painel para organizar a application para universidades dos Estados Unidos.">
  <meta name="theme-color" content="#F1EFE8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,100,400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="side" id="side" aria-label="Navegação"></aside>
    <div class="side-scrim" data-a="side-close"></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegação principal"></nav>
  <div class="modal-root" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
